        - generic [ref=e57]:
          - heading "Current work" [level=2] [ref=e58]
          - list [ref=e59]:
            - listitem [ref=e60]:
              - strong [ref=e61]: LeCoder MConnect.
              - text: Open-source mobile bridge for AI coding agents. node-pty plus Cloudflare Tunnel plus a QR pairing flow means Claude Code, Cursor, and OpenCode run from a phone with full TUI fidelity. Live at
              - link "lecoder.lesearch.ai" [ref=e62] [cursor=pointer]:
                - /url: https://lecoder.lesearch.ai
              - text: .
            - listitem [ref=e63]:
              - strong [ref=e64]: LeSearch AI.
              - text: Founder and product lead. RAG with hard citation grounding so the model cannot claim a fact it cannot highlight in the source. 50+ beta users, 30+ structured user interviews shaped the roadmap.
            - listitem [ref=e65]:
              - strong [ref=e66]: CloudAGI.
              - text: Custom agentic workflows for small businesses on a plugin-first credit-metered runtime. TypeScript + Bun.
            - listitem [ref=e67]:
              - strong [ref=e68]: Software Factory.
              - text: Early-stage system for deploying agent-built personal apps to a user's own always-on hardware (Mac mini, Raspberry Pi) over Cloudflare Tunnels. Web apps install as PWAs.
            - listitem [ref=e69]:
              - strong [ref=e70]: NL2Shell.
              - text: Natural language to shell commands at
              - link "nl2shell.com" [ref=e71] [cursor=pointer]:
                - /url: https://nl2shell.com
              - text: ", backed by a fine-tuned model."
        - generic [ref=e72]:
          - heading "Career arc" [level=2] [ref=e73]
          - paragraph [ref=e74]: Four years in marketing leadership taught me how to mine customer signals, brief creative teams, and quantify lift on every campaign. When LLMs became real, the same instincts (discovery, copy testing, activation analysis) turned out to be the foundation of agentic engineering work.
          - paragraph [ref=e75]: "I leaned in. I co-built LeSearch AI, owned prompt architectures, and shipped scrappy MVPs every week: SQL agents for non-technical ops teams, auto-browsing Q&A bots for scouts, due-diligence summarizers. Every launch was instrumented so we could cut scope or double down based on real user behavior, not opinions."
          - paragraph [ref=e76]: The next layer was code. I started writing the systems myself instead of briefing them, which led to LeCoder MConnect, CloudAGI, the Software Factory bet, and a move to San Francisco to be closer to the people building this category.
        - generic [ref=e77]:
          - heading "What I believe" [level=2] [ref=e78]
          - list [ref=e79]:
            - listitem [ref=e80]:
              - strong [ref=e81]: Mobile is the next agent surface.
              - text: Engineers spend half their lives away from their laptop. The agent should not stop because the human stepped away.
            - listitem [ref=e82]:
              - strong [ref=e83]: Open beats walled.
              - text: Composable agents on standardized protocols (MCP) will outpace any single closed ecosystem. My open-source work bets on that.
            - listitem [ref=e84]:
              - strong [ref=e85]: Citation grounding is non-negotiable.
              - text: If a model cannot point to the source of a claim, it should not ship that claim. Hallucinations are not a research problem; they are a product problem.
            - listitem [ref=e86]:
              - strong [ref=e87]: Marketing instincts compound in product engineering.
              - text: Discovery, briefing, copy iteration, and activation analysis translate directly. Anyone underestimating that is leaving leverage on the table.
